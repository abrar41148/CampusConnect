{% extends 'base.html' %}
{% load static %}

{% block title %}Login — CampusConnect{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="card shadow-sm" style="width: 100%; max-width: 420px;">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <i class="fas fa-graduation-cap fa-3x text-primary mb-2"></i>
        <h1 class="fs-3 fw-bold">CampusConnect</h1>
        <p class="text-muted small">Sign in to your account</p>
      </div>

      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold" for="login-username">Username</label>
          <input class="form-control" id="login-username" type="text" name="username"
                 placeholder="Enter your username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold" for="login-password">Password</label>
          <input class="form-control" id="login-password" type="password" name="password"
                 placeholder="Enter your password" required>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small">
          <i class="fas fa-exclamation-circle me-1"></i>{{ error }}
        </div>
        {% endif %}

        <button class="btn btn-primary w-100" type="submit">
          <i class="fas fa-sign-in-alt me-1"></i>Login
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
