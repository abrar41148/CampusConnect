{% extends 'base.html' %}

{% block title %}Join Classroom — CampusConnect{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
  <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary btn-sm">
    <i class="fas fa-arrow-left me-1"></i>Back
  </a>
  <h1 class="mb-0 fs-4 fw-bold"><i class="fas fa-key text-primary me-2"></i>Join a Classroom</h1>
</div>

<div class="card shadow-sm" style="max-width: 420px;">
  <div class="card-body p-4">
    <p class="text-muted small mb-3">Enter the 6-character join code provided by your teacher.</p>
    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold" for="join-code">Join Code <span class="text-danger">*</span></label>
        <input class="form-control text-uppercase font-monospace" id="join-code"
               type="text" name="join_code" placeholder="e.g. AB12CD"
               maxlength="8" autocomplete="off" required>
      </div>
      <button class="btn btn-primary w-100" type="submit">
        <i class="fas fa-sign-in-alt me-1"></i>Join Classroom
      </button>
    </form>

    {% if message %}
    <div class="alert {% if 'Success' in message or 'success' in message %}alert-success{% else %}alert-danger{% endif %} mt-3 mb-0">
      <i class="fas fa-{% if 'Success' in message or 'success' in message %}check-circle{% else %}exclamation-circle{% endif %} me-1"></i>
      {{ message }}
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
